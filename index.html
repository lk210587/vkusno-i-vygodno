
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вкусно и выгодно</title>
<style>
  .main-button {
  display: block;
  text-align: center;
  background: #55734e;
  color: white;
  padding: 15px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  margin: 15px 0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #faf8f1;
  color: #343d2e;
}
header {
  padding: 25px 20px;
  background: #e8eddd;
}
h1 { margin: 0; font-size: 27px; }
header p { margin-bottom: 0; color: #66715b; }
main { padding: 20px; max-width: 600px; margin: auto; }
h2 { font-size: 21px; }
.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.item {
  background: white;
  padding: 20px 12px;
  border-radius: 16px;
  text-align: center;
  font-size: 15px;
  box-shadow: 0 2px 10px #00000008;
}
.icon { font-size: 30px; margin-bottom: 8px; }
button {
  border: 0;
  background: #657b4e;
  color: white;
  padding: 15px;
  width: 100%;
  border-radius: 12px;
  font-size: 16px;
  margin-top: 15px;
  cursor: pointer;
}
.welcome {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
}
footer {
  text-align: center;
  padding: 25px;
  color: #78816f;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>🥑 Вкусно и выгодно</h1>
  <p>Планируй меню. Экономь. Наслаждайся!</p>
</header>

<main>
  <div class="welcome">
    <h2>Добро пожаловать!</h2>
    <p>Что будем готовить сегодня?</p>
   <a href="recipes.html" class="main-button">
  Выбрать рецепты
</a>
  </div>

  <h2>Моё приложение</h2>
  <div class="menu">
    <div class="item">
      <div class="icon">🍲</div>
      Рецепты
    </div>
    <div class="item">
      <div class="icon">📅</div>
      Меню на неделю
    </div>
    <div class="item">
      <div class="icon">🛒</div>
      Список покупок
    </div>
    <div class="item">
      <div class="icon">🥕</div>
      Моя кладовая
    </div>
    <div class="item">
      <div class="icon">💰</div>
      Мой бюджет
    </div>
    <div class="item">
      <div class="icon">❤️</div>
      Избранное
    </div>
  </div>
</main>

<footer>
  Вкусно и выгодно © 2026
</footer>
</body>
</html>
